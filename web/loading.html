<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jadwal Kerja</title>
<noscript><meta http-equiv="refresh" content="0;url=/app"></noscript>
<style>/* Dasar halaman */
html,body{height:100%;margin:0;background:#121212}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}

/* From Uiverse.io by AqFox */
.spinner {
 width: 44px;
 height: 44px;
 animation: spinner-y0fdc1 2s infinite ease;
 transform-style: preserve-3d;
}

.spinner > div {
 background-color: rgba(0,77,255,0.2);
 height: 100%;
 position: absolute;
 width: 100%;
 border: 2px solid #004dff;
}

.spinner div:nth-of-type(1) {
 transform: translateZ(-22px) rotateY(180deg);
}

.spinner div:nth-of-type(2) {
 transform: rotateY(-270deg) translateX(50%);
 transform-origin: top right;
}

.spinner div:nth-of-type(3) {
 transform: rotateY(270deg) translateX(-50%);
 transform-origin: center left;
}

.spinner div:nth-of-type(4) {
 transform: rotateX(90deg) translateY(-50%);
 transform-origin: top center;
}

.spinner div:nth-of-type(5) {
 transform: rotateX(-90deg) translateY(50%);
 transform-origin: bottom center;
}

.spinner div:nth-of-type(6) {
 transform: translateZ(22px);
}

@keyframes spinner-y0fdc1 {
 0% {
  transform: rotate(45deg) rotateX(-25deg) rotateY(25deg);
 }

 50% {
  transform: rotate(45deg) rotateX(-385deg) rotateY(25deg);
 }

 100% {
  transform: rotate(45deg) rotateX(-385deg) rotateY(385deg);
 }
}
html[data-theme=light],html[data-theme=light] body{background:#f6f8fc}
</style>
</head>
<body>
<!-- From Uiverse.io by AqFox -->
<div class="spinner">
<div></div>
<div></div>
<div></div>
<div></div>
<div></div>
<div></div>
</div>
<script>
/* Pindah ke aplikasi setelah loading */
var LOADING_MS = 2000;
setTimeout(function(){location.replace('/app')}, LOADING_MS);
/* Beri tahu Java bahwa halaman sudah tergambar (lapisan penutup dilepas) */
try{requestAnimationFrame(function(){requestAnimationFrame(function(){if(window.JadwalSplash)JadwalSplash.ready()})})}catch(e){}
</script>
</body>
</html>
